# byke bridge (public): every change is vetted and tested; a release is a tag vX.Y.Z, which publishes the image
# registry.gitlab.com/byke-project/com.byke.bridge:X.Y.Z (and :latest) and is the Go module version byke's gateway
# imports for the protocol.
stages:
  - test
  - publish

default:
  tags:
    - byke

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

test:
  stage: test
  image: golang:1.26
  script:
    - test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed" >&2; exit 1; }
    - go vet ./...
    - go test -race ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

publish-image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  needs: [test]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      docker build \
        --build-arg VERSION="$VERSION" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.version=$VERSION" \
        -t "$CI_REGISTRY_IMAGE:$VERSION" .
    - docker push "$CI_REGISTRY_IMAGE:$VERSION"
    - docker tag "$CI_REGISTRY_IMAGE:$VERSION" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
